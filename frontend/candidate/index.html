<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="form-container">
    <header class="form-header">
        <h1>Job Application</h1>
        <p>Please fill in your details to apply.</p>
    </header>

    <form id="candidateForm">
        <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" required class="form-input">
        </div>

        <div class="grid-cols-2">
            <div class="form-group">
                <label class="form-label">Email ID</label>
                <input type="email" name="email" required class="form-input">
            </div>
            <div class="form-group">
                <label class="form-label">Mobile Number</label>
                <input type="tel" name="phone" pattern="[0-9]{10}" required class="form-input">
            </div>
        </div>

        <div class="grid-cols-2">
            <div class="form-group">
                <label class="form-label">Position</label>
                <select name="position" class="form-select">
                    <option value="Frontend Developer">Frontend Developer</option>
                    <option value="Backend Developer">Backend Developer</option>
                    <option value="Fullstack Developer">Fullstack Developer</option>
                    <option value="UI/UX Designer">UI/UX Designer</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">Experience (Years)</label>
                <input type="number" name="experience" min="0" required class="form-input">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label">Resume (PDF/DOC)</label>
            <input type="file" name="resume" accept=".pdf,.doc,.docx" required class="form-file">
        </div>

        <button type="submit" id="submitBtn" class="form-button">
            Submit Application
        </button>
    </form>

    <div id="statusMsg" class="status-message" style="display:none;"></div>
</div>

<!-- ✅ Correct JS file -->
<script src="script.js"></script>
</body>
</html>
